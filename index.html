<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu huella de Yeshúa</title>
  <style>
    /* Estilos generales y fondo oscuro cálido */
    body {
      margin: 0;
      padding: 0;
      background-color: #121214 !important;
      color: #e1e1e6 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .rostro-container {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Rostro sin círculo, sin fondo y más grande */
    .rostro-imagen-estatica {
      width: 210px;
      height: auto;
      max-height: 260px;
      object-fit: contain;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      border-radius: 0;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.6));
      transition: all 0.5s ease;
    }

    .progreso-texto {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #a0a0ab;
      letter-spacing: 0.5px;
    }

    #quiz-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #preguntas-dinamicas {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pantalla-bienvenida {
      text-align: center;
      width: 100%;
    }

    .pantalla-bienvenida h2 {
      font-size: 1.5rem;
      color: #f0f0f5;
      margin-bottom: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .subtitulo-bienvenida {
      font-size: 1.05rem;
      color: #b0b0bc;
      line-height: 1.5;
      margin-bottom: 28px;
      padding: 0 10px;
    }

    .contenedor-umbral {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    /* Estilo interactivo para el cántaro de agua (reemplaza al botón tradicional) */
    .sello-cantaro {
      width: 110px;
      height: auto;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: inline-block;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 10px rgba(194, 155, 56, 0.2));
    }

    .sello-cantaro:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 20px rgba(242, 201, 76, 0.5));
    }

    .bloque-info {
      font-size: 0.8rem;
      color: #8c8c9a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-align: center;
    }

    .pregunta-enunciado h3 {
      font-size: 1.15rem;
      color: #f0f0f5;
      line-height: 1.4;
      margin-bottom: 24px;
      font-weight: 400;
      text-align: center;
    }

    .opciones-lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .opcion-btn {
      background-color: #1a1a1e;
      color: #d0d0dc;
      border: 1px solid #2a2a30;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.3;
      width: 100%;
      box-sizing: border-box;
    }

    .opcion-btn:hover {
      background-color: #25252b;
      border-color: #c29b38;
      color: #ffffff;
    }

    .resultado-final {
      width: 100%;
      text-align: center;
    }

    .tarjeta-resumen {
      background-color: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }

    .puntaje-final {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .mensaje-evolutivo {
      font-size: 0.95rem;
      color: #b0b0bc;
      line-height: 1.5;
    }

    .texto-invitacion {
      font-size: 0.85rem;
      color: #8c8c9a;
      margin-bottom: 24px;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Contenedor principal de la aplicación -->
  <div id="app-container">
    
    <!-- Contenedor del Rostro Transparente de Yeshúa sin círculo -->
    <div class="rostro-container">
      <img id="rostro-yeshua" src="assets/icons/rostro-yeshua.png" alt="Rostro de Yeshúa" class="rostro-imagen-estatica">
      <div id="progreso-texto" class="progreso-texto">Alineación espiritual: 0%</div>
    </div>

    <!-- Contenedor dinámico del quiz y bienvenida -->
    <div id="quiz-container">
      <div id="preguntas-dinamicas">
        <!-- Pantalla de bienvenida con el cántaro interactivo -->
        <div class="pantalla-bienvenida">
          <h2>Tu huella de Yeshúa</h2>
          <p class="subtitulo-bienvenida">¿Cuánto de las enseñanzas de Jesucristo aplicás en tu vida?</p>
          <div class="contenedor-umbral">
            <img id="btn-comenzar" src="assets/icons/cantaro-agua.png" alt="Revelar mi código huella" class="sello-cantaro">
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
