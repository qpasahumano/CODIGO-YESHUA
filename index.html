<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu huella de Yeshúa</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121214 !important;
      color: #e1e1e6 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      padding: 12px 20px 24px 20px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .rostro-container {
      margin-top: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Rostro optimizado en tamaño y revelado progresivo profundo (inicia casi imperceptible) */
    .rostro-imagen-estatica {
      width: 175px;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      border-radius: 0;
      opacity: 0.05; 
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4)) grayscale(100%);
      transition: all 0.6s ease;
    }

    .progreso-texto {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #a0a0ab;
      letter-spacing: 0.5px;
    }

    #quiz-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #preguntas-dinamicas {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pantalla-bienvenida {
      text-align: center;
      width: 100%;
    }

    .pantalla-bienvenida h2 {
      font-size: 1.45rem;
      color: #f0f0f5;
      margin-top: 4px;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .subtitulo-bienvenida {
      font-size: 0.95rem;
      color: #b0b0bc;
      line-height: 1.4;
      margin-bottom: 22px;
      padding: 0 10px;
    }

    .contenedor-umbral {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5px;
    }

    /* Cántaro ampliado, centralizado y estético sin texto lateral */
    .sello-cantaro {
      width: 135px;
      height: auto;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: block;
      margin: 0 auto;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 14px rgba(194, 155, 56, 0.3));
    }

    .sello-cantaro:hover, .sello-cantaro:active {
      transform: scale(1.06);
      filter: drop-shadow(0 0 24px rgba(242, 201, 76, 0.65));
    }

    .subtitulo-explicacion {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #c5b898;
      line-height: 1.4;
      padding: 0 12px;
      text-align: center;
    }

    .bloque-info {
      font-size: 0.78rem;
      color: #8c8c9a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-align: center;
    }

    /* Estilo para la referencia bíblica en tonos pasteles beige/lino */
    .referencia-biblica {
      font-size: 0.8rem;
      color: #d6c597;
      background-color: rgba(194, 155, 56, 0.08);
      border: 1px solid rgba(194, 155, 56, 0.2);
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    .pregunta-enunciado h3 {
      font-size: 1.1rem;
      color: #f0f0f5;
      line-height: 1.4;
      margin-bottom: 20px;
      font-weight: 400;
      text-align: center;
    }

    .opciones-lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .opcion-btn {
      background-color: #1a1a1e;
      color: #d0d0dc;
      border: 1px solid #2a2a30;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.93rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.3;
      width: 100%;
      box-sizing: border-box;
    }

    .opcion-btn:hover {
      background-color: #25252b;
      border-color: #c29b38;
      color: #ffffff;
    }

    .resultado-final {
      width: 100%;
      text-align: center;
    }

    .tarjeta-resumen {
      background-color: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 16px;
      padding: 20px;
      margin: 18px 0;
      text-align: center;
    }

    .puntaje-final {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .mensaje-evolutivo {
      font-size: 0.93rem;
      color: #b0b0bc;
      line-height: 1.5;
    }

    .texto-invitacion {
      font-size: 0.82rem;
      color: #8c8c9a;
      margin-bottom: 20px;
      line-height: 1.4;
      text-align: center;
    }

    /* Firma institucional al pie */
    .firma-autor {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #787885;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Contenedor principal de la aplicación -->
  <div id="app-container">
    
    <!-- Contenedor del Rostro Transparente de Yeshúa -->
    <div class="rostro-container">
      <img id="rostro-yeshua" src="assets/icons/rostro-yeshua.png" alt="Rostro de Yeshúa" class="rostro-imagen-estatica">
      <div id="progreso-texto" class="progreso-texto">Alineación espiritual: 0%</div>
    </div>

    <!-- Contenedor dinámico del quiz y bienvenida -->
    <div id="quiz-container">
      <div id="preguntas-dinamicas">
        <!-- Pantalla de bienvenida con el cántaro centrado y ampliado -->
        <div class="pantalla-bienvenida">
          <h2>Tu huella de Yeshúa</h2>
          <p class="subtitulo-bienvenida">¿Cuánto de las enseñanzas de Jesucristo aplicás en tu vida?</p>
          <div class="contenedor-umbral">
            <img id="btn-comenzar" src="assets/icons/cantaro-agua.png" alt="Revelar mi código huella" class="sello-cantaro">
            <p class="subtitulo-explicacion">La huella de Jesucristo se irá iluminando conforme más enseñanzas de él estés aplicando en tu vida</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Firma de autoría al pie -->
    <div class="firma-autor">Creado por Carlos Amado Selim</div>

  </div>

  <!-- Audio de fondo ambiental -->
  <audio id="audio-fondo" loop>
    <source src="assets/audio/fondo-espiritual.mp3" type="audio/mpeg">
  </audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
