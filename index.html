<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu huella de Yeshúa</title>
  
  <!-- Fuente histórica / clásica inspirada en inscripciones y manuscritos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0f !important;
      color: #e1e1e6 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      padding: 12px 16px 28px 16px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .rostro-container {
      margin-top: 6px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Rostro: casi invisible al 0% (0.02) */
    .rostro-imagen-estatica {
      width: 180px;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      background: transparent;
      border: none;
      padding: 0;
      opacity: 0.02;
      filter: grayscale(100%) brightness(0.4);
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .progreso-texto {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #8a8a95;
      letter-spacing: 0.8px;
    }

    #quiz-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #preguntas-dinamicas {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pantalla-bienvenida {
      text-align: center;
      width: 100%;
    }

    .pantalla-bienvenida h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.55rem;
      color: #f2c94c;
      margin-top: 6px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitulo-bienvenida {
      font-size: 0.92rem;
      color: #b0b0bc;
      line-height: 1.4;
      margin-bottom: 18px;
      padding: 0 10px;
    }

    .contenedor-umbral {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Cántaro ampliado a 165px */
    .sello-cantaro {
      width: 165px;
      height: auto;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: block;
      margin: 0 auto;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 16px rgba(194, 155, 56, 0.35));
    }

    .sello-cantaro:hover, .sello-cantaro:active {
      transform: scale(1.05);
      filter: drop-shadow(0 0 25px rgba(242, 201, 76, 0.7));
    }

    /* Texto "Tocar para iniciar" achicado y sutil */
    .texto-tocar-iniciar {
      font-size: 0.72rem;
      color: #9a8866;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 8px;
      margin-bottom: 14px;
      opacity: 0.85;
    }

    .subtitulo-explicacion {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #d4c5a0;
      line-height: 1.4;
      padding: 0 14px;
      text-align: center;
    }

    /* Tarjeta Pergamino Manuscrito */
    .tarjeta-pergamino {
      background-image: url('assets/icons/pergamino.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      padding: 32px 24px 36px 24px;
      box-sizing: border-box;
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
      color: #2b1810; /* Tinta sepia oscura de alto contraste */
      text-align: center;
    }

    .bloque-info {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      color: #5c3a21;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .referencia-biblica {
      font-size: 0.82rem;
      color: #3b2213;
      background-color: rgba(92, 58, 33, 0.08);
      border: 1px solid rgba(92, 58, 33, 0.22);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      text-align: center;
      line-height: 1.35;
    }

    .referencia-biblica strong {
      font-family: 'Cinzel', serif;
      color: #2b1810;
    }

    .pregunta-enunciado h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      color: #1c0e07;
      line-height: 1.4;
      margin-top: 0;
      margin-bottom: 18px;
      font-weight: 700;
    }

    .opciones-lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .opcion-btn {
      background-color: rgba(43, 24, 16, 0.92);
      color: #f2e3c6;
      border: 1px solid #5c3a21;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.3;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }

    .opcion-btn:hover, .opcion-btn:active {
      background-color: #5c3a21;
      color: #ffffff;
      border-color: #8c5a33;
    }

    .resultado-final {
      width: 100%;
      text-align: center;
    }

    .tarjeta-resumen {
      background-color: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 16px;
      padding: 20px;
      margin: 18px 0;
      text-align: center;
    }

    .puntaje-final {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .mensaje-evolutivo {
      font-size: 0.93rem;
      color: #b0b0bc;
      line-height: 1.5;
    }

    .texto-invitacion {
      font-size: 0.82rem;
      color: #8c8c9a;
      margin-bottom: 20px;
      line-height: 1.4;
      text-align: center;
    }

    .firma-autor {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #787885;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- Rostro de Yeshúa -->
    <div class="rostro-container">
      <img id="rostro-yeshua" src="assets/icons/rostro-yeshua.png" alt="Rostro de Yeshúa" class="rostro-imagen-estatica">
      <div id="progreso-texto" class="progreso-texto">Alineación espiritual: 0%</div>
    </div>

    <!-- Contenedor dinámico -->
    <div id="quiz-container">
      <div id="preguntas-dinamicas">
        <div class="pantalla-bienvenida">
          <h2>Tu huella de Yeshúa</h2>
          <p class="subtitulo-bienvenida">¿Cuánto de las enseñanzas de Jesucristo aplicás en tu vida?</p>
          <div class="contenedor-umbral">
            <img id="btn-comenzar" src="assets/icons/cantaro-agua.png" alt="Revelar mi código huella" class="sello-cantaro">
            <span class="texto-tocar-iniciar">Tocar para iniciar</span>
            <p class="subtitulo-explicacion">La huella de Jesucristo se irá iluminando conforme más enseñanzas de él estés aplicando en tu vida</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Firma de autoría -->
    <div class="firma-autor">Creado por Carlos Amado Selim</div>

  </div>

  <audio id="audio-fondo" loop>
    <source src="assets/audio/fondo-espiritual.mp3" type="audio/mpeg">
  </audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
