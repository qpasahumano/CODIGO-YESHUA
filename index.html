<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tu huella de Yeshúa</title>
  
  <!-- Tipografía Histórica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Uncial+Antiqua&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0f !important;
      color: #e1e1e6 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 440px;
      padding: 8px 14px 14px 14px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
    }

    .top-slot {
      margin-top: 2px;
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 145px;
      justify-content: center;
    }

    /* Rostro dinámico del test */
    .rostro-imagen-estatica {
      width: 130px;
      height: auto;
      max-height: 155px;
      object-fit: contain;
      background: transparent;
      border: none;
      padding: 0;
      opacity: 0.02;
      filter: grayscale(100%) brightness(0.4);
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Imagen o emblema de presentación para la interfaz principal */
    .emblema-presentacion {
      width: 85px;
      height: auto;
      filter: drop-shadow(0 0 12px rgba(242, 201, 76, 0.4));
    }

    .progreso-texto {
      margin-top: 2px;
      font-size: 0.75rem;
      color: #9a9aab;
      letter-spacing: 0.8px;
    }

    #quiz-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    #preguntas-dinamicas {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pantalla-bienvenida {
      text-align: center;
      width: 100%;
    }

    .pantalla-bienvenida h2 {
      font-family: 'Cinzel Decorative', serif !important;
      font-size: 1.35rem;
      color: #f2c94c;
      margin-top: 2px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .subtitulo-bienvenida {
      font-size: 0.85rem;
      color: #b0b0bc;
      line-height: 1.3;
      margin-bottom: 10px;
      padding: 0 10px;
    }

    .contenedor-umbral {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .sello-cantaro {
      width: 130px;
      height: auto;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: block;
      margin: 0 auto;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 14px rgba(194, 155, 56, 0.35));
    }

    .sello-cantaro:hover, .sello-cantaro:active {
      transform: scale(1.05);
      filter: drop-shadow(0 0 22px rgba(242, 201, 76, 0.7));
    }

    .texto-tocar-iniciar {
      font-size: 0.68rem;
      color: #bfa575;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .subtitulo-explicacion {
      margin-top: 4px;
      font-size: 0.78rem;
      color: #d4c5a0;
      line-height: 1.3;
      padding: 0 10px;
      text-align: center;
    }

    /* TARJETA PERGAMINO COMPACTA DE ALTO CONTRASTE */
    .tarjeta-pergamino {
      background-image: url('assets/icons/pergamino.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      padding: 22px 18px 24px 18px;
      box-sizing: border-box;
      width: 100%;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
      color: #0d0502; /* Tinta sepia súper oscura para máxima visibilidad */
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .bloque-info {
      font-family: 'Cinzel', serif !important;
      font-size: 0.7rem;
      color: #3b1b08 !important;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .referencia-biblica {
      font-family: 'Uncial Antiqua', 'Cinzel', serif !important;
      font-size: 0.78rem;
      color: #1a0802 !important;
      background-color: rgba(59, 27, 8, 0.14);
      border: 1px solid rgba(59, 27, 8, 0.3);
      padding: 5px 10px;
      border-radius: 5px;
      margin-bottom: 8px;
      text-align: center;
      line-height: 1.3;
      font-weight: bold;
    }

    .referencia-biblica strong {
      font-family: 'Cinzel Decorative', serif !important;
      color: #0d0301 !important;
      font-size: 0.82rem;
    }

    .pregunta-enunciado h3 {
      font-family: 'Uncial Antiqua', 'Cinzel', serif !important;
      font-size: 0.95rem;
      color: #080201 !important;
      line-height: 1.35;
      margin-top: 2px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .opciones-lista {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    .opcion-btn {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: rgba(20, 8, 2, 0.96);
      color: #faeed7;
      border: 1px solid #4a2810;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.3;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    .opcion-btn:hover, .opcion-btn:active {
      background-color: #4a2810;
      color: #ffffff;
      border-color: #8c5a33;
    }

    .resultado-final {
      width: 100%;
      text-align: center;
    }

    .tarjeta-resumen {
      background-color: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
      text-align: center;
    }

    .puntaje-final {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .mensaje-evolutivo {
      font-size: 0.85rem;
      color: #b0b0bc;
      line-height: 1.4;
    }

    .texto-invitacion {
      font-size: 0.75rem;
      color: #8c8c9a;
      margin-bottom: 12px;
      line-height: 1.3;
      text-align: center;
    }

    .firma-autor {
      margin-top: 6px;
      font-size: 0.68rem;
      color: #787885;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- Slot superior dinámico (Muestra emblema en bienvenida y rostro oculto en el quiz) -->
    <div id="top-slot-container" class="top-slot">
      <img src="assets/icons/cantaro-agua.png" alt="Símbolo Yeshúa" class="emblema-presentacion">
    </div>

    <!-- Contenedor principal de pantallas -->
    <div id="quiz-container">
      <div id="preguntas-dinamicas">
        <div class="pantalla-bienvenida">
          <h2>Tu huella de Yeshúa</h2>
          <p class="subtitulo-bienvenida">¿Cuánto de las enseñanzas de Jesucristo aplicás en tu vida?</p>
          <div class="contenedor-umbral">
            <img id="btn-comenzar" src="assets/icons/cantaro-agua.png" alt="Revelar mi código huella" class="sello-cantaro">
            <span class="texto-tocar-iniciar">Tocar para iniciar</span>
            <p class="subtitulo-explicacion">La huella de Jesucristo se irá iluminando conforme más enseñanzas de él estés aplicando en tu vida</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Firma institucional al pie -->
    <div class="firma-autor">Creado por Carlos Amado Selim</div>

  </div>

  <audio id="audio-fondo" loop>
    <source src="assets/audio/fondo-espiritual.mp3" type="audio/mpeg">
  </audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
