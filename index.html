<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu huella de Yeshúa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor principal de la aplicación -->
  <div id="app-container">
    
    <!-- Contenedor del Rostro Progresivo de Yeshúa -->
    <div class="rostro-container">
      <svg id="rostro-yeshua" viewBox="0 0 200 200" class="rostro-svg">
        <path class="trazo-rostro capa-base estado-oculto" d="M100,20 C60,20 40,50 40,90 C40,140 70,170 100,180 C130,170 160,140 160,90 C160,50 140,20 100,20 Z" />
        <path class="trazo-rostro capa-ojos estado-oculto" d="M70,85 Q85,75 100,85 Q115,75 130,85" />
        <path class="trazo-rostro capa-luz estado-oculto" d="M100,95 L100,145 M80,130 Q100,150 120,130" />
      </svg>
      <div id="progreso-texto" class="progreso-texto">Alineación espiritual: 0%</div>
    </div>

    <!-- Contenedor dinámico -->
    <div id="quiz-container">
      <div id="preguntas-dinamicas">
        <!-- Pantalla de bienvenida con la frase exacta y el umbral -->
        <div class="pantalla-bienvenida">
          <h2>Tu huella de Yeshúa</h2>
          <p class="subtitulo-bienvenida">¿Cuánto de las enseñanzas de Jesucristo aplicás en tu vida?</p>
          <div class="contenedor-umbral">
            <button id="btn-comenzar" class="sello-umbral">Revelar mi código huella</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
