<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tu huella de Yeshúa</title>
  
  <!-- Tipografía Histórica y Fuente Manuscrita para la Firma -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0f !important;
      color: #e1e1e6 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }

    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 900px;
      padding: 8px 12px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .rostro-container {
      margin-top: 4px;
      margin-bottom: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
      position: relative;
    }

    .rostro-imagen-estatica {
      width: 135px;
      height: auto;
      max-height: 150px;
      object-fit: contain;
      background: transparent;
      border: none;
      padding: 0;
      opacity: 0.02;
      filter: grayscale(100%) brightness(0.4);
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .progreso-texto {
      margin-top: 3px;
      font-size: 0.75rem;
      color: #9a9aa8;
      letter-spacing: 0.8px;
    }

    #quiz-container {
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    #preguntas-dinamicas {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pantalla-bienvenida {
      text-align: center;
      width: 100%;
    }

    .pantalla-bienvenida h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.45rem;
      color: #f2c94c;
      margin-top: 4px;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitulo-bienvenida {
      font-size: 0.86rem;
      color: #b0b0bc;
      line-height: 1.35;
      margin-bottom: 12px;
      padding: 0 10px;
    }

    .contenedor-umbral {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .sello-cantaro {
      width: 160px;
      height: auto;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: block;
      margin: 0 auto;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 16px rgba(194, 155, 56, 0.4));
    }

    .sello-cantaro:hover, .sello-cantaro:active {
      transform: scale(1.05);
      filter: drop-shadow(0 0 25px rgba(242, 201, 76, 0.75));
    }

    .texto-tocar-iniciar {
      font-size: 0.72rem;
      color: #a8946e;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 6px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .subtitulo-explicacion {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #d4c5a0;
      line-height: 1.35;
      padding: 0 12px;
      text-align: center;
    }

    .tarjeta-pergamino {
      background-image: url('assets/icons/pergamino.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      padding: 20px 16px;
      box-sizing: border-box;
      width: 100%;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
      color: #120904;
      text-align: center;
    }

    .bloque-info {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      color: #4a2810;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .referencia-biblica {
      font-size: 0.82rem;
      color: #2b1408;
      background-color: rgba(74, 40, 16, 0.1);
      border: 1px solid rgba(74, 40, 16, 0.25);
      padding: 6px 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.35;
    }

    .referencia-biblica strong {
      font-family: 'Cinzel', serif;
      color: #1a0a03;
      font-size: 0.86rem;
    }

    .pregunta-enunciado h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.98rem;
      color: #0f0502;
      line-height: 1.35;
      margin-top: 0;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .opciones-lista {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    .opcion-btn {
      background-color: rgba(30, 14, 6, 0.94);
      color: #f7ebcf;
      border: 1px solid #5c3a21;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.3;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    .opcion-btn:hover, .opcion-btn:active {
      background-color: #5c3a21;
      color: #ffffff;
      border-color: #8c5a33;
    }

    .resultado-final {
      width: 100%;
      text-align: center;
    }

    .tarjeta-resumen {
      background-color: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
      text-align: center;
    }

    .puntaje-final {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .mensaje-evolutivo {
      font-size: 0.86rem;
      color: #b0b0bc;
      line-height: 1.4;
    }

    .texto-invitacion {
      font-size: 0.76rem;
      color: #8c8c9a;
      margin-bottom: 12px;
      line-height: 1.3;
      text-align: center;
    }

    /* Estilo de Firma Manuscrita / Caligrafía a Pluma sobre Papiro */
    .firma-autor {
      margin-top: 4px;
      font-family: 'Great Vibes', cursive;
      font-size: 1.2rem;
      color: #8c5a33;
      letter-spacing: 1px;
      text-align: center;
      width: 100%;
      flex-shrink: 0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- Slot superior dinámico -->
    <div id="top-slot-container" class="rostro-container">
      <img src="assets/icons/cantaro-agua.png" alt="Símbolo Yeshúa" style="width: 90px; height: auto; opacity: 0.85; filter: drop-shadow(0 0 10px rgba(242, 201, 76, 0.3));">
    </div>

    <!-- Contenedor dinámico principal -->
    <div id="quiz-container">
      <div id="preguntas-dinamicas">
        <div class="pantalla-bienvenida">
          <h2>Tu huella de Yeshúa</h2>
          <p class="subtitulo-bienvenida">¿Cuánto de las enseñanzas de Jesucristo aplicás en tu vida?</p>
