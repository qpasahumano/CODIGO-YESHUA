<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tu huella de Yeshúa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,600;1,600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0f;
      color: #e1e1e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }

    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 900px;
      padding: 6px 12px 10px 12px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .rostro-container {
      margin-top: 4px;
      margin-bottom: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
    }

    /* Rostro de Yeshúa más grande y reubicado sutilmente más abajo */
    .rostro-imagen-estatica {
      width: 165px;
      height: auto;
      max-height: 185px;
      object-fit: contain;
      background: transparent;
      border: none;
      padding: 0;
      opacity: 0.02;
      filter: grayscale(100%) brightness(0.4);
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      margin-top: 6px;
    }

    #quiz-container {
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    #preguntas-dinamicas {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pantalla-bienvenida {
      text-align: center;
      width: 100%;
    }

    .pantalla-bienvenida h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.4rem;
      color: #f2c94c;
      margin-top: 2px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .subtitulo-bienvenida {
      font-size: 0.84rem;
      color: #b0b0bc;
      line-height: 1.3;
      margin-bottom: 10px;
      padding: 0 10px;
    }

    .contenedor-umbral {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .sello-cantaro {
      width: 160px;
      height: auto;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: block;
      margin: 0 auto;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 16px rgba(194, 155, 56, 0.4));
    }

    .sello-cantaro:hover, .sello-cantaro:active {
      transform: scale(1.05);
      filter: drop-shadow(0 0 25px rgba(242, 201, 76, 0.75));
    }

    .texto-tocar-iniciar {
      font-size: 0.7rem;
      color: #a8946e;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .subtitulo-explicacion {
      margin-top: 2px;
      font-size: 0.78rem;
      color: #d4c5a0;
      line-height: 1.3;
      padding: 0 10px;
      text-align: center;
    }

    /* Sin recuadro marrón, tipografía marrón hebraica/clásica (EB Garamond) */
    .tarjeta-pergamino {
      background: transparent;
      padding: 4px 6px;
      box-sizing: border-box;
      width: 100%;
      color: #3b2213;
      text-align: center;
    }

    .referencia-biblica {
      font-size: 0.9rem;
      color: #b8860b;
      background-color: rgba(184, 134, 11, 0.08);
      border-left: 3px solid #c29b38;
      padding: 6px 10px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 10px;
      text-align: left;
      line-height: 1.4;
      font-family: 'EB Garamond', serif;
      font-weight: 600;
    }

    .referencia-biblica strong {
      font-family: 'Cinzel', serif;
      color: #f2c94c;
      font-size: 0.92rem;
    }

    .pregunta-enunciado h3 {
      font-family: 'EB Garamond', serif;
      font-size: 1.05rem;
      color: #f0f0f5;
      line-height: 1.4;
      margin-top: 0;
      margin-bottom: 12px;
      font-weight: 600;
      text-align: left;
    }

    .opciones-lista {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .opcion-btn {
      background-color: rgba(26, 26, 30, 0.9);
      color: #d0d0dc;
      border: 1px solid #3a3a45;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-family: 'EB Garamond', serif;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.35;
      width: 100%;
      box-sizing: border-box;
      font-weight: 600;
    }

    .opcion-btn:hover, .opcion-btn:active {
      background-color: #25252b;
      border-color: #c29b38;
      color: #ffffff;
    }

    .resultado-final {
      width: 100%;
      text-align: center;
    }

    .tarjeta-resumen {
      background-color: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 12px;
      margin: 8px 0;
      text-align: center;
    }

    .puntaje-final {
      font-size: 0.98rem;
      margin-bottom: 6px;
    }

    .mensaje-evolutivo {
      font-size: 0.84rem;
      color: #b0b0bc;
      line-height: 1.35;
    }

    .texto-invitacion {
      font-size: 0.74rem;
      color: #8c8c9a;
      margin-bottom: 10px;
      line-height: 1.3;
      text-align: center;
    }

    /* AUDITADO: Definición formal de la firma institucional con Great Vibes y color marrón cálido */
    .firma-autor {
      margin-top: 4px;
      margin-bottom: 4px;
      font-family: 'Great Vibes', cursive;
      font-size: 1.5rem;
      color: #c29b38;
      letter-spacing: 1px;
      text-align: center;
      width: 100%;
      flex-shrink: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="top-slot-container" class="rostro-container"></div>

    <div id="quiz-container">
      <div id="preguntas-dinamicas">
        <div class="pantalla-bienvenida">
          <h2>Tu huella de Yeshúa</h2>
          <p class="subtitulo-bienvenida">¿Cuánto de las enseñanzas de Jesucristo aplicás en tu vida?</p>
          <div class="contenedor-umbral">
            <img id="btn-comenzar" src="assets/icons/cantaro-agua.png" alt="Revelar mi código huella" class="sello-cantaro">
            <span class="texto-tocar-iniciar">Tocar para iniciar</span>
            <p class="subtitulo-explicacion">La huella de Jesucristo se irá iluminando conforme más enseñanzas de él estés aplicando en tu vida</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Crédito institucional visible en la interfaz principal -->
    <div id="footer-container" class="firma-autor">Carlos Amado Selim</div>
  </div>

  <audio id="audio-fondo" loop>
    <source src="assets/audio/fondo-espiritual.mp3" type="audio/mpeg">
  </audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
